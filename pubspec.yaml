name: shopengo
description: "Your designated shopping buddy"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  easy_localization: ^3.0.8
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  kiwi: ^5.0.1
  path_provider: ^2.1.6

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_gen: ^5.15.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  mockito: ^5.8.1
  very_good_analysis: ^11.0.0

flutter_gen:
  output: lib/generated/

  integrations:
    flutter_svg: true

  assets:
    enabled: true
    outputs:
      class_name: Assets

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/fonts/
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Bold.ttf
        - asset: assets/fonts/Rubik-Light.ttf
        - asset: assets/fonts/Rubik-Medium.ttf
        - asset: assets/fonts/Rubik-Regular.ttf
        - asset: assets/fonts/Rubik-SemiBold.ttf
